[package]
name = "promptbridge"
version = "0.3.1"
edition = "2021"
authors = ["PromptBridge Contributors"]
description = "A quick CLI tool that translates coding prompts via global hotkey. Translated text is automatically copied to clipboard."
readme = "README.md"
license = "MIT"
repository = "https://github.com/pedroaugusto04/PromptBridge"
keywords = ["cli", "prompt-engineering", "llm", "claude", "translation"]
categories = ["command-line-utilities", "development-tools"]
include = ["templates/**/*", "src/**/*", "Cargo.toml", "README.md", "LICENSE"]

[target.'cfg(target_os = "linux")'.dependencies]
# Linux-specific dependencies are handled via system tools (xclip, zenity, notify-send)
# No additional Rust crates needed

[target.'cfg(target_os = "windows")'.dependencies]
# Windows-specific dependencies are handled via system tools (PowerShell)
# No additional Rust crates needed

[target.'cfg(target_os = "macos")'.dependencies]
# MacOS-specific dependencies are handled via system tools (osascript)
# No additional Rust crates needed

[dependencies]
# CLI parsing & configuration
clap = { version = "4.4", features = ["derive", "env"] }
figment = { version = "0.10", features = ["toml", "env"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
dotenvy = "0.15"
dirs = "5.0"

# Async runtime & HTTP client
tokio = { version = "1.35", features = ["full"] }
reqwest = { version = "0.11", features = ["json"] }
async-trait = "0.1"

# Text processing & AST parsing
regex = "1.10"
pulldown-cmark = "0.9"
lazy_static = "1.4"

# Terminal & PTY proxy
portable-pty = "0.8"
arboard = "3.3"
colored = "2.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# Interactive prompts
dialoguer = "0.11"

[dev-dependencies]
tokio-test = "0.4"
