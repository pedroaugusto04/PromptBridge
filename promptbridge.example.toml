# PromptBridge Configuration Example

[general]
# Default provider to use: "google_translate", "ollama", "openai", or "mock"
default_provider = "google_translate"

# Target language for prompt translation (e.g., "en", "es", "fr", "zh", "zh-cn")
target_language = "en"

# Display mode for CLI Proxy Gateway ("preview" or "silent")
# "preview": Visual update of the transformed prompt in the agent TUI
# "silent": Transparently passes the transformed prompt to the backend
mode = "preview"

# Automatically copy transformed prompt to clipboard when running standard transform command
auto_copy_clipboard = true

# Enable strict preservation of technical terms (code blocks, paths, logs, commands)
preserve_technical_terms = true

# Keep Ollama model loaded in memory for this many minutes (prevents cold starts)
# Set to 0 to disable, or increase for longer keep-alive periods
keep_alive_interval_minutes = 60

[providers.google_translate]
type = "google_translate"
# Free Google Translate API - no configuration required

[providers.ollama]
type = "ollama"
base_url = "https://pedro-duarte.ddns.net/ollama"
model = "qwen-fast"
temperature = 0.0

[providers.openai]
type = "openai"
base_url = "https://api.openai.com/v1"
api_key = "env:OPENAI_API_KEY" # Reads from environment variable or raw key string
model = "gpt-4o-mini"
temperature = 0.0

[providers.deepseek]
type = "openai"
base_url = "https://api.deepseek.com/v1"
api_key = "env:DEEPSEEK_API_KEY"
model = "deepseek-coder"
temperature = 0.0

[providers.mock]
type = "mock"
temperature = 0.0
